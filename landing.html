    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) { console.error('Error:', error, errorInfo.componentStack); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-slate text-pure">
              <div className="text-center p-8 max-w-md bg-carbon border border-ash rounded-xl">
                <h1 className="text-2xl font-mono text-red mb-4">Error</h1>
                <p className="text-fog mb-4">{this.state.error?.message || "Unexpected error."}</p>
                <button onClick={() => window.location.reload()} className="btn-primary">Reload Page</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function LandingApp() {
      return React.createElement(Landing, null);
    }

    document.addEventListener('DOMContentLoaded', function() {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(React.createElement(ErrorBoundary, null, React.createElement(LandingApp)));
      }
    });
